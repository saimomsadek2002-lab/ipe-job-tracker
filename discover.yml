name: Find real job feeds (run once)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python tracker.py discover --apply
      - name: Save companies.json
        run: |
          git config user.name "job-tracker"
          git config user.email "job-tracker@users.noreply.github.com"
          git add companies.json
          git commit -m "Auto-detected job feeds" || echo "No changes"
          git push
