name: Daily IPE job check
on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC = 08:00 Dhaka time
  workflow_dispatch: {}    # lets you run it manually from the Actions tab
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Check companies
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python tracker.py run
      - name: Save results
        run: |
          git config user.name "job-tracker"
          git config user.email "job-tracker@users.noreply.github.com"
          git add data docs
          git commit -m "Daily update" || echo "No changes"
          git push
